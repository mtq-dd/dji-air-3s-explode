name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: 打包 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # runner 镜像已预装 Android SDK，不用第三方 action（setup-android@v3 会去找
      # 已被移除的 "tools" 包而失败）。这里只做 licenses 确认与缺件补装。
      - name: 准备 Android SDK
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms" 2>/dev/null || true
          SDKMGR="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 Web 产物存在
        run: |
          test -f index.html || { echo "缺少 index.html，请先在本地执行 node build.mjs"; exit 1; }
          ls -lh index.html

      - name: 构建 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 收集产物
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/*.apk dist/dji-air-3s-debug.apk
          ls -lh dist/

      - name: 上传 APK（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: dji-air-3s-debug-apk
          path: dist/dji-air-3s-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/dji-air-3s-debug.apk
          generate_release_notes: true
